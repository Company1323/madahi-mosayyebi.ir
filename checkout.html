<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تکمیل سفارش | میثاق جرعه نوشان</title>

    <link rel="stylesheet" href="style1.css">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Vazirmatn", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .checkout-page {
            width: 100%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .checkout-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .checkout-title h1 {
            margin-bottom: 8px;
        }

        .checkout-title p {
            color: #777;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
            align-items: start;
        }

        .checkout-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        .checkout-box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 21px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: .2s;
            background: #fff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #c9a227;
            box-shadow: 0 0 0 3px rgba(201, 162, 39, .12);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .required {
            color: #d9534f;
        }

        /* سفارش */

        .order-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .order-item:first-child {
            padding-top: 0;
        }

        .order-item-name {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .order-item-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #eee;
        }

        .submit-order {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: #c9a227;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .submit-order:hover {
            background: #a98716;
            transform: translateY(-1px);
        }

        .back-cart {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #777;
            text-decoration: none;
        }

        .back-cart:hover {
            color: #000;
        }

        .empty-order {
            text-align: center;
            color: #777;
            padding: 25px 0;
        }

        /* موبایل */

        @media (max-width: 800px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .order-summary {
                order: -1;
            }
        }

        @media (max-width: 500px) {

            .checkout-page {
                margin-top: 20px;
                padding: 0 12px;
            }

            .checkout-box {
                padding: 18px;
                border-radius: 14px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .checkout-title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="checkout-page">

    <div class="checkout-title">
        <h1>تکمیل سفارش</h1>
        <p>لطفاً اطلاعات خود را با دقت وارد کنید.</p>
    </div>


    <div class="checkout-grid">

        <!-- فرم اطلاعات خریدار -->

        <div class="checkout-box">

            <h2>اطلاعات خریدار و ارسال</h2>

            <form id="checkoutForm">

                <div class="form-row">

                    <div class="form-group">
                        <label>
                            نام <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="نام"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>
                            نام خانوادگی <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="نام خانوادگی"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label>
                        شماره موبایل <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="مثلاً 09123456789"
                        inputmode="numeric"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        ایمیل
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            استان <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="province"
                            name="province"
                            placeholder="مثلاً آذربایجان شرقی"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            شهر <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="مثلاً تبریز"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        آدرس کامل <span class="required">*</span>
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="استان، شهر، خیابان، کوچه، پلاک، واحد و..."
                        required
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            کد پستی <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="postalCode"
                            name="postalCode"
                            placeholder="۱۰ رقم"
                            inputmode="numeric"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            پلاک
                        </label>

                        <input
                            type="text"
                            id="buildingNumber"
                            name="buildingNumber"
                            placeholder="مثلاً ۱۲"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        توضیحات سفارش
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="اگر توضیح خاصی درباره سفارش یا ارسال دارید، اینجا بنویسید."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-order"
                    id="submitOrder"
                >
                    ثبت اطلاعات سفارش
                </button>

            </form>


            <a href="index.html" class="back-cart">
                ← بازگشت به فروشگاه
            </a>

        </div>


        <!-- خلاصه سفارش -->

        <div class="checkout-box order-summary">

            <h2>خلاصه سفارش</h2>

            <div id="orderItems">
                <!-- محصولات اینجا قرار می‌گیرند -->
            </div>

            <div class="order-total">

                <span>مبلغ کل</span>

                <span id="orderTotal">
                    ۰ تومان
                </span>

            </div>

        </div>

    </div>

</div>


<script>

    // =========================
    // دریافت سبد خرید
    // =========================

    let cart =
        JSON.parse(localStorage.getItem("shoppingCart")) || [];


    const orderItems =
        document.getElementById("orderItems");

    const orderTotal =
        document.getElementById("orderTotal");


    // =========================
    // نمایش سفارش
    // =========================

    function renderOrder() {

        orderItems.innerHTML = "";

        if (cart.length === 0) {

            orderItems.innerHTML = `
                <div class="empty-order">
                    سبد خرید شما خالی است.
                </div>
            `;

            orderTotal.textContent = "۰ تومان";

            document.getElementById("submitOrder").disabled = true;

            return;
        }


        let total = 0;


        cart.forEach(item => {

            const itemTotal =
                item.price * item.quantity;

            total += itemTotal;


            orderItems.innerHTML += `

                <div class="order-item">

                    <div class="order-item-name">
                        ${item.name}
                    </div>

                    <div class="order-item-info">

                        <span>
                            تعداد: ${item.quantity}
                        </span>

                        <span>
                            ${itemTotal.toLocaleString("fa-IR")} تومان
                        </span>

                    </div>

                </div>

            `;

        });


        orderTotal.textContent =
            total.toLocaleString("fa-IR") + " تومان";
    }


    renderOrder();


    // =========================
    // فرم سفارش
    // =========================

    document
        .getElementById("checkoutForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            if (cart.length === 0) {

                alert("سبد خرید شما خالی است.");

                return;
            }


            const orderData = {

                firstName:
                    document.getElementById("firstName").value.trim(),

                lastName:
                    document.getElementById("lastName").value.trim(),

                phone:
                    document.getElementById("phone").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                province:
                    document.getElementById("province").value.trim(),

                city:
                    document.getElementById("city").value.trim(),

                address:
                    document.getElementById("address").value.trim(),

                postalCode:
                    document.getElementById("postalCode").value.trim(),

                buildingNumber:
                    document.getElementById("buildingNumber").value.trim(),

                description:
                    document.getElementById("description").value.trim(),

                products: cart,

                createdAt:
                    new Date().toISOString()

            };


            console.log("ORDER:", orderData);


            alert(
                "اطلاعات سفارش با موفقیت دریافت شد.\n\n" +
                "در مرحله بعد، این اطلاعات را به Google Sheets ارسال می‌کنیم."
            );

        });

</script>

</body>
</html>
